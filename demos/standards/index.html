<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웹표준 서비스 운영 UI</title>  <script type="module" crossorigin src="../../assets/standards-B9R2Q2Kk.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/style-D73U988X.js">
  <link rel="stylesheet" crossorigin href="../../assets/style-DF3icjDz.css">
</head><body><a class="skip" href="#app">본문 바로가기</a><header class="demo-top"><a href="../../index.html">← 포트폴리오</a><span>HTML · SCSS · JAVASCRIPT</span></header><main id="app" class="demo-wrap"><div class="eyebrow">SERVICE OPERATIONS / WEB STANDARDS</div><h1>서비스 운영 관리</h1><p class="subtle">시맨틱 HTML과 기본 JavaScript로 구성한 목록·검색·입력 UI.</p><p class="notice">개인 프로젝트 · 가상 데이터 · 새로고침하면 초기화됩니다.</p><div class="demo-tabs" role="group" aria-label="업무 화면"><button class="active" aria-pressed="true" data-screen="list">요청 목록</button><button aria-pressed="false" data-screen="form">업무 요청 등록</button></div><section class="panel" id="request-list"><div class="demo-heading"><h2>업무 요청 현황</h2><span class="subtle" id="result-count" role="status"></span></div><form class="toolbar" id="search-form"><label>요청명 검색<input name="query" id="request-query" placeholder="예: 대시보드"></label><label>진행 상태<select id="request-status"><option value="전체">전체</option><option>접수</option><option>진행 중</option><option>완료</option></select></label><button class="button">조회</button><button type="reset" class="button secondary">초기화</button></form><div class="table-scroll"><table><caption class="sr-only">운영 요청 목록</caption><thead><tr><th scope="col">번호</th><th scope="col">요청명</th><th scope="col">부서</th><th scope="col">우선순위</th><th scope="col">상태</th><th scope="col">상세</th></tr></thead><tbody id="requests"></tbody></table></div></section><section class="panel" id="request-form-panel" hidden><h2>업무 요청 등록</h2><form id="request-form" class="form-stack" novalidate><label>요청명 *<input name="title" required maxlength="80" aria-describedby="form-error"></label><div class="detail-grid"><label>요청 부서 *<select name="department" required><option value="">부서 선택</option><option>운영팀</option><option>기획팀</option><option>관리팀</option></select></label><label>우선순위<select name="priority"><option>보통</option><option>높음</option><option>낮음</option></select></label></div><p id="form-error" role="alert" class="error"></p><button class="button" type="submit">요청 등록</button></form></section><p id="request-message" role="status"></p></main><dialog id="request-detail"><button class="dialog-close" aria-label="닫기">×</button><div id="request-detail-body"></div><button class="button" id="detail-confirm">확인</button></dialog></body></html>
